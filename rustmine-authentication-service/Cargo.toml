[package]
name = "rustmine-authentication-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
env_logger = "0.11.10"
log = "0.4.29"
uuid = { version = "1.23.1", features = ["v4"] }
serde = { version = "1.0.228", features = ["derive"] }
argon2 = "0.5.3"
rand_core = "0.10.1"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
time = "0.3.49"

[dependencies.sea-orm]
version = "2.0.0-rc.38"
features = ["sqlx-mysql", "runtime-tokio-rustls", "macros", "schema-sync", "entity-registry"]
