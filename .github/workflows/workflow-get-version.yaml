name: Get release version

on:
  workflow_call:
    outputs:
      version:
        description: The next release version, with the prefix (e.g. v1.2.3)
        value: ${{ jobs.get-version.outputs.version }}
      version-number:
        description: The next release version, without the prefix (e.g. 1.2.3)
        value: ${{ jobs.get-version.outputs.version-number }}

jobs:
  get-version:
    name: Get next release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get-release-version.outputs.version-name }}
      version-number: ${{ steps.get-release-version.outputs.version }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get release version
        uses: wemogy/get-release-version-action@v4.3.3
        id: get-release-version
        with:
          create-tag: false

      - name: Fail on missing changes
        if: steps.get-release-version.outputs.tag-created != 'true'
        run: |
          exit 1
