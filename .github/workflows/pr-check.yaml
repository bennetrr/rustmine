name: Check PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test-build release artifacts
    uses: ./.github/workflows/workflow-build.yaml
    permissions:
      contents: read

  check:
    name: Check code style
    uses: ./.github/workflows/workflow-check.yaml
    permissions:
      contents: read
