name: Check PR

on:
  push:
    branches:
      - release

jobs:
  get-version:
    name: Get next release version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get-release-version.outputs.version-name }}
      version-number: ${{ steps.get-release-version.outputs.version }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Git credentials
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Get release version
        uses: wemogy/get-release-version-action@v4.3.3
        id: get-release-version
        with:
          git-username: github-actions[bot]
          git-email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Fail on missing changes
        if: steps.get-release-version.outputs.tag-created != 'true'
        run: |
          exit 1

  build:
    name: Build release artifacts
    uses: ./.github/workflows/workflow-build.yaml
    needs:
      - get-version
    with:
      version: ${{ needs.get-version.outputs.version }}
      publish: true

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - get-version
      - build
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-binary*
          merge-multiple: true
          path: release-binaries

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          name: RustMine ${{ needs.get-version.outputs.version-number }}
          tag: ${{ needs.get-version.outputs.version }}
          generateReleaseNotes: true
          artifacts: release-binaries/*
